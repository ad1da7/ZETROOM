<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать кинозал</title>
    <style>
        body { background: #121212; color: white; font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: #1e1e1e; padding: 40px; border-radius: 10px; text-align: center; }
        input { padding: 10px; width: 250px; margin-bottom: 20px; border-radius: 5px; border: none; }
        button { background: #00f3ff; color: black; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Создать комнату</h2>
        <form method="POST" action="{% url 'create_room' %}">
            {% csrf_token %}
            <input type="text" name="room_name" placeholder="Название фильма/комнаты..." required>
            <button type="submit">Создать</button>
        </form>
    </div>
</body>
</html>
