<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party | Кинозал</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f11;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: #1a1a1e;
            border: 1px solid #2a2a30;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 800px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .title {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 40px;
            color: #ffffff;
        }

        .forms-wrapper {
            display: flex;
            gap: 40px;
        }

        .form-block {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .form-block h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #a0a0a5;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 16px;
            background-color: #0f0f11;
            border: 1px solid #2a2a30;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #55555c;
        }

        input::placeholder {
            color: #55555c;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-create {
            background-color: #3b82f6; /* Синий */
            color: white;
        }

        .btn-create:hover {
            background-color: #2563eb;
        }

        .btn-join {
            background-color: #10b981; /* Зеленый */
            color: white;
        }

        .btn-join:hover {
            background-color: #059669;
        }

        .divider {
            width: 1px;
            background-color: #2a2a30;
        }

        .error-message {
            background-color: #ef4444;
            color: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            text-align: center;
            font-size: 0.9rem;
        }

        /* Для мобильных телефонов */
        @media (max-width: 600px) {
            .forms-wrapper {
                flex-direction: column;
                gap: 30px;
            }
            .divider {
                width: 100%;
                height: 1px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Watch Party</div>

        <div class="forms-wrapper">
            <!-- Блок создания -->
            <div class="form-block">
                <h2>Создать комнату</h2>
                <form method="POST" action="{% url 'create_room' %}">
                    {% csrf_token %}
                    <input type="text" name="room_name" placeholder="Название фильма..." required autocomplete="off">
                    <button type="submit" class="btn-create">Создать</button>
                </form>
            </div>

            <div class="divider"></div>

            <!-- Блок входа -->
            <div class="form-block">
                <h2>Войти по коду</h2>

                {% if error %}
                    <div class="error-message">{{ error }}</div>
                {% endif %}

                <form method="POST" action="{% url 'join_room' %}">
                    {% csrf_token %}
                    <input type="text" name="query" placeholder="Название или " required autocomplete="off">
                    <button type="submit" class="btn-join">Войти</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
