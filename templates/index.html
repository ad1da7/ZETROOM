<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Watch Party | Главная</title>
    <style>
        body { background: #121212; color: white; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { display: flex; gap: 40px; padding: 40px; background: #1e1e1e; border-radius: 15px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); }
        .box { display: flex; flex-direction: column; align-items: center; width: 300px; }
        h2 { color: #00f3ff; margin-bottom: 20px; text-align: center; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: white; box-sizing: border-box; }
        input:focus { outline: none; border-color: #00f3ff; }
        button { width: 100%; padding: 12px; background: #00f3ff; color: black; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
        button:hover { background: #00c0cc; box-shadow: 0 0 15px #00c0cc; }
        .divider { width: 2px; background: #333; }
        .error { color: #ff4c4c; margin-bottom: 15px; font-size: 0.9rem; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <!--блок создания комнаты-->
        <div class="box">
            <h2>Создать комнату</h2>
            <form method="POST" action="{% url 'create_room' %}">
                {% csrf_token %}
                <input type="text" name="room_name" placeholder="Название фильма..." required>
                <button type="submit">Создать</button>
            </form>
        </div>

        <div class="divider"></div>

        <!--блок входа в комнату-->
        <div class="box">
            <h2>Войти в комнату</h2>
            <!--вывод ошибки если комната не найдена-->
            {% if error %}
                <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{% url 'join_room' %}">
                {% csrf_token %}
                <input type="text" name="query" placeholder="Название или код " required>
                <button type="submit">Войти</button>
            </form>
        </div>
    </div>
</body>
</html>
