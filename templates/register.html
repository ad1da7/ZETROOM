<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Party | Регистрация</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f0f11;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background-color: #1a1a1e;
            border: 1px solid #2a2a30;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .title {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 28px;
        }

        .form-group { margin-bottom: 16px; }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            color: #a0a0a5;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background-color: #0f0f11;
            border: 1px solid #2a2a30;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: #55555c; }

        .helptext {
            display: block;
            font-size: 0.78rem;
            color: #55555c;
            margin-top: 6px;
            line-height: 1.4;
        }

        .helptext ul {
            padding-left: 16px;
            margin-top: 4px;
        }

        .errorlist {
            list-style: none;
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 6px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background-color: #10b981;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-submit:hover { background-color: #059669; }

        .btn-submit:active { transform: scale(0.98); }

        .footer-links {
            margin-top: 24px;
            text-align: center;
            font-size: 0.9rem;
            color: #a0a0a5;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .footer-links a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Создать аккаунт</div>

        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <span class="helptext">{{ field.help_text }}</span>
                    {% endif %}
                    {{ field.errors }}
                </div>
            {% endfor %}
            <button type="submit" class="btn-submit">Зарегистрироваться</button>
        </form>

        <div class="footer-links">
            <div>Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></div>
            <div><a href="/" style="color: #a0a0a5;">← На главную</a></div>
        </div>
    </div>
</body>
</html>
