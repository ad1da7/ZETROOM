{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zetroom | Подтверждение почты</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; border-radius: 0 !important; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(rgba(248, 200, 212, 0.55), rgba(248, 200, 212, 0.65)),
                        url("{% static 'images/vice_city.png' %}") no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .auth-box {
            background: #ffffff;
            border: 3px solid #1e161a;
            box-shadow: 10px 10px 0px #d65a7b;
            padding: 40px;
            width: 100%;
            max-width: 440px;
        }
        h1 {
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #1e161a;
        }
        p {
            font-size: 0.9rem;
            color: #6b4c57;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        input {
            width: 100%;
            padding: 14px;
            font-size: 1.3rem;
            text-align: center;
            letter-spacing: 6px;
            border: 2px solid #1e161a;
            background: #fce8ed;
            margin-bottom: 16px;
            outline: none;
            font-weight: 700;
            color: #1e161a;
        }
        input:focus {
            border-color: #d65a7b;
            background: #ffffff;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #1e161a;
            color: #f8c8d4;
            border: none;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn:hover {
            background: #d65a7b;
            color: #ffffff;
        }
        .err {
            background: #1e161a;
            color: #f8c8d4;
            border-left: 4px solid #c93b5b;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="auth-box">
        <h1>Подтверждение Email</h1>
        <p>Мы отправили 6-значный код на <b>{{ email }}</b></p>
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="code" maxlength="6" placeholder="000000" required autocomplete="off">
            <button type="submit" class="btn">Подтвердить и войти</button>
        </form>
    </div>
</body>
</html>
