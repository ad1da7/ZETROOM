<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Комната: {{ room.name }}</title>
    <style>
        body { background: #121212; color: white; font-family: Arial; margin: 0; padding: 20px; }
        .main { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .video { flex: 3; background: #000; aspect-ratio: 16/9; border: 2px dashed #333; display: flex; justify-content: center; align-items: center; border-radius: 10px; }
        .sidebar { flex: 1; background: #1e1e1e; border-radius: 10px; padding: 20px; }
        .sidebar h3 { margin-top: 0; color: #00f3ff; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 10px; background: #2a2a2a; margin-bottom: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <h1 style="text-align: center;">{{ room.name }}</h1>
    <p style="text-align: center; color: gray;">Ссылка для друзей: http://127.0.0.1:8000/room/{{ room.uuid }}/</p>

    <div class="main">
        <div class="video">
            <h2 style="color: #555;">Плеер (Спринт 2)</h2>
        </div>

        <div class="sidebar">
            <h3>Участники ({{ participants|length }})</h3>
            <ul>
                {% for p in participants %}
                    <li>{{ p.user.username }} <br><small style="color: gray;">Вошёл в {{ p.joined_at|time:"H:i" }}</small></li>
                {% empty %}
                    <li>Пока никого нет...</li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>
