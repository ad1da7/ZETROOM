<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Комната: {{ room.name }}</title>
    <style>
        body { background: #121212; color: white; font-family: Arial, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: #1e1e1e; padding: 40px; border-radius: 15px; width: 100%; max-width: 600px; box-shadow: 0 0 20px rgba(0, 243, 255, 0.1); }
        h1 { color: #00f3ff; text-align: center; }
        .link { text-align: center; color: #888; margin-bottom: 30px; }
        .participants { list-style: none; padding: 0; }
        .participants li { background: #2a2a2a; padding: 10px; margin-bottom: 5px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ room.name }}</h1>
        <p class="link">Ссылка для друзей: http://127.0.0.1:8000/room/{{ room.uuid }}/</p>

        <h3>Участники ({{ participants|length }})</h3>
        <ul class="participants">
            {% for p in participants %}
                <li>{{ p.user.username }}</li>
            {% empty %}
                <li>Пока никого нет...</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
