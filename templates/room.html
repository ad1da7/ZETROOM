<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Комната: {{ room.name }}</title>
    <style>
        /* Базовые стили для страницы */
        body {
            background: #0f0f11;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        /* Главный контейнер с двумя колонками */
        .main {
            display: flex;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Блок для видео (занимает 3/4 ширины) */
        .video {
            flex: 3;
            background: #000;
            aspect-ratio: 16/9;
            border: 2px dashed #333;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
        }

        /* Боковая панель для чата (занимает 1/4 ширины) */
        .sidebar {
            flex: 1;
            background: #1a1a1e;
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 60vh;
        }

        /* Окно с историей сообщений */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            background: #0f0f11;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 15px;
        }

        /* Форма отправки сообщения */
        .chat-form {
            display: flex;
            gap: 10px;
        }

        /* Поле ввода */
        .chat-form input {
            flex: 1;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #0f0f11;
            color: white;
        }

        /* Кнопка отправки */
        .chat-form button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        /* Стили для самих сообщений (их будет добавлять JS) */
        .message-item {
            background: #2a2a30;
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .message-author {
            color: #3b82f6;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">{{ room.name }}</h1>

    <div class="main">
        <!-- Левая часть: плеер (заглушка) -->
        <div class="video">
            <h2 style="color: #555;"></h2>
        </div>

        <!-- Правая часть: чат -->
        <div class="sidebar">
            <h3>Чат</h3>

            <!-- Окно вывода сообщений -->
            <div class="chat-box" id="chat-box">
                <!-- Сообщения будут добавляться сюда через JavaScript -->
            </div>

            <!-- Форма ввода -->
            <form class="chat-form" id="chat-form">
                <input type="text" id="chat-input" placeholder="Сообщение..." autocomplete="off">
                <button type="submit">➤</button>
            </form>
        </div>
    </div>

    <!-- Передаем UUID комнаты в JavaScript для подключения к WebSocket -->
    {{ room.uuid|json_script:"room-uuid" }}

    <!-- Подключаем скрипт, который напишет Участник 3 -->
    <script src="/static/js/sync_player.js"></script>
</body>
</html>
